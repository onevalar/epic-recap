name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR runs share a group. Every main commit runs to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Select checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          let required = true;
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            const files = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z', process.env.BASE_SHA, 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            // Scripts' Markdown (including the exported release guide) is not documentation-only.
            required = !files.length || !files.every(file => file.startsWith('docs/') || /^[^/]+\.md$/.test(file));
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${required}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, required ? 'Full validation required.\n' : 'Documentation-only PR: tests skipped; CI still reports success.\n');
          JS

  unit:
    name: Unit, release and package
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # These checks use the committed vendor files, not node_modules or npm's cache.
      - run: npm test
      - run: npm run test:release
      - run: npm run package:store

  browser:
    name: Browser (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [recording, retry, limits, review]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # ubuntu-24.04 supplies Chromium's shared libraries. Playwright still validates
      # them; don't disable its host checks. Both launchers use channel: chromium,
      # so downloading a second, headless-shell browser serves no test.
      - name: Install Chromium
        run: npx playwright install --no-shell chromium
      - name: Browser tests
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
          ARTIFACT_DIR: dist/browser
        run: npm run test:browser
      - name: Screenshot validation
        if: matrix.suite == 'recording'
        run: npm run release:screenshots
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ matrix.suite }}-${{ github.run_id }}
          path: dist/browser/
          retention-days: 7
          if-no-files-found: ignore

  ci:
    name: CI
    if: always()
    needs: [changes, unit, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful validation
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$CHANGES" = success
          if [ "$REQUIRED" = false ]; then
            test "$UNIT" = skipped && test "$BROWSER" = skipped
          else
            test "$REQUIRED" = true && test "$UNIT" = success && test "$BROWSER" = success
          fi
