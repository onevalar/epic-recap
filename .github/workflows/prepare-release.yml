name: 准备发版
run-name: 准备 ${{ inputs.version }}${{ inputs.dry_run && '（演练）' || '' }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本：patch（修复）、minor（新功能）、major，或完整版本号'
        default: patch
        required: true
        type: string
      notes:
        description: '更新说明（留空则使用 Git 提交标题）'
        type: string
      submit:
        description: '检查通过后直接提交商店审核（涉及界面或隐私变化时停止）'
        default: false
        type: boolean
      dry_run:
        description: '仅演练：生成预览，不改仓库版本、不创建标签、不上传商店'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      review_required: ${{ steps.prepare.outputs.review_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 选择上次已提交版本作为比较基准
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tagName // ""')
          echo "BASELINE_TAG=$baseline" >> "$GITHUB_ENV"
      - name: 同步版本与生成说明
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: npm run release:prepare
      - name: 测试
        run: |
          npm test
          npm run test:release
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          ARTIFACT_DIR: dist/browser
      - name: 打包并生成展示图预览
        run: |
          npm run package:store
          npm run release:screenshots
          node scripts/release/finalize.mjs
      - name: 保存预览与测试结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preview-${{ github.run_id }}
          path: |
            dist/release/
            dist/browser/
          retention-days: 30
      - name: 保存版本并创建 GitHub 发布草稿
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || { echo 'main 已更新，请重新准备'; exit 1; }
          git add manifest.json package.json package-lock.json
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
          (cd dist/release && zip -qr screenshots.zip screenshots)
          gh release create "v$VERSION" --verify-tag --draft --title "Epic Recap $VERSION · 待提交商店" --notes-file dist/release/NOTES.md "dist/release/epic-recap-$VERSION-chrome-web-store.zip" dist/release/release.json dist/release/screenshots.zip
          echo "预览已保存：https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: prepare
    if: ${{ inputs.submit && !inputs.dry_run && needs.prepare.outputs.review_required == 'false' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      metadata_confirmed: false
      publish_mode: DEFAULT_PUBLISH
    secrets: inherit
